  slug: enterprise-fde-and-one-person-ops
  title: 企业 FDE 交付、高管审核制与一人公司工作台
  importance: critical
  importance_rationale: 覆盖 @cnzhihao（乙方 FDE）、@FuSheng_0306（甲方 CEO 转型）、@jinchenma_ai（一人公司与传统企业咨询）、@sitinme（收款召回与岗位 Bot）、@icycat（本地数据留痕）的完整组织与商业闭环。
