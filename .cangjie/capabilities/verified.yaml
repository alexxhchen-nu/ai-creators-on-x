entry:
  name: ai-creators-on-x
  description: '当用户在做 AI 编程/多分支并发开发、出海工具站 SEO/GEO 增长、AIGC 视频与代码渲染动效（Video as Code）、消除代码/UI/视频/写作中的「AI 味」、大模型与 Agent 性能实测选型、或传统企业 FDE 交付与一人公司自动化运营时调用。浓缩 20 位中文 X 技术创作者 1,145 条实战帖的八大可执行工作流：Agent 软件工厂、SEO/GEO 增长引擎、Video as Code 视觉流水线、全栈去 AI 味协议、产物级 Benchmark 与模型路由、FDE 交付与高管审核制、前沿账号信息源雷达、从零重建学习法。不适用于：实时股价/币价查询、与 AI/出海/内容生产无关的纯行政流程、要求绕过支付校验或人工闸门的高危操作。Triggers: AI 创作者方法论/软件工厂/worktree 并发/xcode 冷编译/一词一页/TDH/GEO 意图组/Fan-out 选题/白模预演/Video as Code/去 AI 味/早期智商债/FDE 交付/高管审核制/信息源雷达/账号雷达/从零实现/教学法。'
  core_principles:
  - Agent 的瓶颈已从模型智力转向人类审核带宽（3–5 个并发会话上限）：用「一项目一专属 Bot + Git Worktree 并行 + E2E 录屏/视图截图自检」替代人工逐行盯屏幕。
  - 出海工具站生死取决于结构与承接形态：先按「一书三层（Entity → Topic Map → URL）」与「一词一页 TDH」规划，再用「生成器优先」而非纯资讯页承接搜索与 ChatGPT（GEO）流量。
  - 视频与设计全面代码化（Video & Marketing as Code）：用粗糙白模预演定调度、先拆 BGM 节拍排时间轴，再交由 Agent 写 Remotion/SwiftUI/HTML 代码或调 MCP 渲染成片。
  - 去 AI 味必须落实为显式黑名单与物理不完美：代码层拦 >5000 tokens 大文件与过度防御；UI 层拉黑 Inter/紫渐变/三栏卡片；视觉层留手抖与后视镜灰尘；写作层严禁 AI 写初稿，坚持人出原稿/口喷观点再润色。
  - 模型选型按场景隔离风险：长线核心代码库锁死 SOTA 并只记关键 Points 防「早期智商债」；ToB 企业交付锁死高稳定国模（DeepSeek/GLM）防 403；评测用「从 0 造产物性能 + 6 次连抽稳定性」取代刷题榜。
  - 企业落地与一人公司严守成本与安全边界：制造业 FDE 先算 5–8 万/系统的 ERP/MES 地基成本并卡死 20 人天上限，配「代码→Agent→人工」三层报错；支付回调与对外发布必须保留签名校验与人工确认闸。
  - 信息源按信号域路由、归属回一手核验：前沿动态按「信号域」而非「实验室」分层订阅，用流速阈值 + 关键词过滤降噪、情报库化沉淀；「谁加入哪家」等归属表述回到当事人原文核验，防二手打假。
  - 理解靠从零重建、教学是最高杠杆：学一个概念 = 从零手写最小可运行版（micrograd/nanoGPT/llm.c 路线），再把重建路径压缩成递进式教程；教学与 agent 工程内容分路由，后者归软件工厂卡。
  out_of_scope:
  - 各大模型 API 或 SaaS 平台今日的实时价格、优惠活动与账单申诉（本文仅提供 2026-11 截面单价口径作核算参考）
  - 绕过支付签名校验、伪造充值回调或未经人工确认直接群发/公开发布的高危操作
  - 国内个人开发者无资质涉足的论坛/UGC 社区合规审批代办
  - 与 AI Agent、独立开发、SEO/GEO、AIGC 视觉或企业数字化无关的通用学科问答
  stop_conditions:
  - 用户询问某平台今日实时价格、故障状态或账号申诉结果 → 明确告知本技能仅含 2026-11 实证截面口径，不猜实时数据。
  - 用户要求跳过支付回调校验或跳过人工审核闸直接执行扣款/群发/上线 → 立即触发红灯停机，先输出「签名校验 + 人工确认闸」方案。
  - 用户仅询问 20 位创作者名单、粉丝数或某人简介 → 直接读取 references/overview.md 回答后即停，不展开六步工程流水线。
  - 用户意图在路由表与 capability-index.md 中均未命中 → 明确告知超出 20 位创作者技术蒸馏范围，不硬套框架。
